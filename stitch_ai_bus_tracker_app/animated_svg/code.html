<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_SVG_START:ANIMATION_26 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_26" style="display:block;"><svg height="100%" viewbox="0 0 400 240" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Sky & Road gradients -->
<lineargradient id="roadGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#334155"></stop>
<stop offset="100%" stop-color="#1e293b"></stop>
</lineargradient>
<lineargradient id="busBodyGrad" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" stop-color="#3b82f6"></stop>
<stop offset="50%" stop-color="#2563eb"></stop>
<stop offset="100%" stop-color="#1d4ed8"></stop>
</lineargradient>
<lineargradient id="glassGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#e0f2fe"></stop>
<stop offset="100%" stop-color="#7dd3fc"></stop>
</lineargradient>
<lineargradient id="cloudGrad" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"></stop>
<stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.6"></stop>
</lineargradient>
<filter height="140%" id="softGlow" width="140%" x="-20%" y="-20%">
<fegaussianblur result="blur" stddeviation="3"></fegaussianblur>
<fecomposite in="SourceGraphic" in2="blur" operator="over"></fecomposite>
</filter>
</defs>
<style>
    @keyframes busBounce {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(0.6deg); }
    }
    @keyframes wheelSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes roadMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -48; }
    }
    @keyframes cloudDrift {
      0% { transform: translateX(50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateX(-260px); opacity: 0; }
    }
    @keyframes cuteBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes exhaustPuff {
      0% { transform: translate(0, 0) scale(0.4); opacity: 0.8; }
      100% { transform: translate(-35px, -18px) scale(1.6); opacity: 0; }
    }
    @keyframes heartFloat {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translate(12px, -30px) scale(1.1); opacity: 0; }
    }
    @keyframes antennaWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(8deg); }
      75% { transform: rotate(-8deg); }
    }

    .bus-wrapper {
      animation: busBounce 0.5s ease-in-out infinite;
      transform-origin: 200px 180px;
    }
    .wheel-rotate {
      animation: wheelSpin 0.7s linear infinite;
    }
    .road-lines {
      stroke-dasharray: 24, 24;
      animation: roadMove 0.4s linear infinite;
    }
    .cloud-1 {
      animation: cloudDrift 9s linear infinite;
    }
    .cloud-2 {
      animation: cloudDrift 14s linear infinite -4s;
    }
    .eye-blink {
      transform-origin: center;
      animation: cuteBlink 3.8s ease-in-out infinite;
    }
    .puff-1 {
      animation: exhaustPuff 1.2s ease-out infinite;
      transform-origin: 90px 172px;
    }
    .puff-2 {
      animation: exhaustPuff 1.2s ease-out infinite 0.6s;
      transform-origin: 90px 172px;
    }
    .heart-icon {
      animation: heartFloat 2.2s ease-in-out infinite;
      transform-origin: 300px 70px;
    }
    .antenna-group {
      animation: antennaWiggle 1s ease-in-out infinite;
      transform-origin: 260px 80px;
    }
  </style>
<!-- Background decorative elements -->
<rect fill="transparent" height="240" width="400" x="0" y="0"></rect>
<!-- Animated Floating Clouds -->
<g class="cloud-1">
<path d="M 330 50 a 14 14 0 0 1 24 -4 a 18 18 0 0 1 30 6 a 12 12 0 0 1 8 20 l -62 0 a 11 11 0 0 1 0 -22 z" fill="url(#cloudGrad)"></path>
</g>
<g class="cloud-2">

<!-- Ground Road Surface -->
<rect fill="url(#roadGrad)" height="42" rx="14" width="370" x="15" y="180"></rect>

<!-- Mini Green & Red Traffic Signal Markers (Subtle) -->

<circle cx="365" cy="190" fill="#ef4444" filter="url(#softGlow)" r="3.5"></circle>

<circle cx="295" cy="62" fill="#22c55e" r="2.5"></circle>
</g>
<!-- Exhaust puffs behind bus -->
<circle class="puff-1" cx="95" cy="172" fill="#cbd5e1" opacity="0.7" r="6"></circle>
<circle class="puff-2" cx="95" cy="172" fill="#e2e8f0" opacity="0.7" r="5"></circle>
<!-- BUS MAIN GROUP (With Bouncing Animation) -->
<g class="bus-wrapper">

<circle cx="257" cy="56" fill="#ffffff" r="3"></circle>

<text fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5" text-anchor="middle" x="261" y="97">LINE 42</text>
<!-- Windows (Big kawaii eyes effect) -->

<!-- Cute Blushing Cheeks (Pink/Red Accent) -->
<ellipse cx="272" cy="135" fill="#f43f5e" opacity="0.85" rx="5" ry="3"></ellipse>
<ellipse cx="236" cy="135" fill="#f43f5e" opacity="0.85" rx="4" ry="2.5"></ellipse>
<!-- Happy Little Smile -->

</g>
<!-- Side Passenger Windows -->
<rect fill="url(#glassGrad)" height="36" rx="10" stroke="#1e293b" stroke-width="2" width="46" x="175" y="108"></rect>
<rect fill="url(#glassGrad)" height="36" rx="10" stroke="#1e293b" stroke-width="2" width="46" x="122" y="108"></rect>
<!-- Passengers silhouette inside (Cute cat/commuter silhouette) -->
<circle cx="198" cy="126" fill="#1e3a8a" opacity="0.75" r="6"></circle>
<path d="M 191 142 A 8 8 0 0 1 205 142 Z" fill="#1e3a8a" opacity="0.75"></path>
<!-- Cute Front Bumper & Dual Headlights (Vibrant Green & White) -->

<!-- Main Glowing Headlight -->
<circle cx="294" cy="154" fill="#fef08a" filter="url(#softGlow)" r="5"></circle>
<circle cx="294" cy="154" fill="#ffffff" r="2.5"></circle>
<!-- Mini Green Sensor Light -->
<circle cx="294" cy="162" fill="#22c55e" r="2"></circle>
<!-- Cute Rear Bumper & Red Taillight -->
<rect fill="#64748b" height="18" rx="3" width="8" x="105" y="148"></rect>
<rect fill="#ef4444" filter="url(#softGlow)" height="12" rx="2" width="5" x="104" y="151"></rect>
<!-- Cute Door Graphic -->
<rect fill="#1e40af" height="48" opacity="0.5" rx="3" width="10" x="216" y="112"></rect>
<line stroke="#0f172a" stroke-width="1.5" x1="221" x2="221" y1="112" y2="160"></line>
<circle cx="218" cy="136" fill="#facc15" r="1.5"></circle>
<!-- Wheel Wells & Wheels -->

<g transform="translate(150, 175)">
<!-- Wheel Arch cutout -->
<path d="M -22 -2 A 22 22 0 0 1 22 -2 Z" fill="#0f172a"></path>
<!-- Wheel Group (Rotates) -->
<g class="wheel-rotate">
<!-- Rubber Tire -->
<circle cx="0" cy="0" fill="#1e293b" r="18" stroke="#0f172a" stroke-width="2"></circle>
<!-- Shiny Chrome Rim with Red Ring -->
<circle cx="0" cy="0" fill="#f1f5f9" r="11"></circle>

<!-- Hubcap details / Lug nuts -->

</g>

<!-- Rubber Tire -->
<circle cx="0" cy="0" fill="#1e293b" r="18" stroke="#0f172a" stroke-width="2"></circle>
<!-- Shiny Chrome Rim with Green Ring -->
<circle cx="0" cy="0" fill="#f1f5f9" r="11"></circle>
<circle cx="0" cy="0" fill="none" r="9" stroke="#22c55e" stroke-width="1.8"></circle>

</g>
</g>
</g>
</svg></div><!-- STITCH_SVG_END:ANIMATION_26 -->
</body>
